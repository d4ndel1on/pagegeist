name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Nothing by default; the job below requests only what it needs.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the "Version packages" branch, create tags/releases
      pull-requests: write # open/update the "Version packages" PR
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      # Install scripts are disabled so no dependency code runs while write tokens are available.
      - run: npm ci --ignore-scripts
      # Full gate: lint, typecheck, tests, build, package checks, size budget, playground build.
      - run: npm run ci
      # Opens a "Version packages" PR while changesets are pending; publishes once it is merged.
      # Publishing uses npm trusted publishing – no NPM_TOKEN secret needed once the package
      # is linked to this repository/workflow on npmjs.com (see CONTRIBUTING.md › Releases).
      # `npm run release` rebuilds dist (a few hundred ms) so the published files always match
      # the released version, even if the gate above changes.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Temporary: only for the very first publish, before the trusted publisher exists.
          # Remove this line and the NPM_TOKEN secret afterwards.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
