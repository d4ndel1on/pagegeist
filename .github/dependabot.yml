version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # The React 18 compatibility is tested explicitly in CI; don't bump the peer range automatically.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      # Node types follow the Node major in .nvmrc, not the latest Node release.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  # Starter apps (examples/starters/*), also the StackBlitz demos: keep Next.js, Vite, React and
  # the published @d4ndel1on/pagegeist current in their lockfiles, one grouped PR. CI tests them
  # against the packed tarball anyway (scripts/build-starters.mjs).
  - package-ecosystem: npm
    directories: ['/examples/starters/*']
    schedule:
      interval: weekly
    versioning-strategy: increase
    groups:
      starters:
        patterns: ['*']
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
